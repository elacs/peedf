<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>peedf</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<div id="toolbar">
			<div id="page_control_box" class="toolbar_control_box">
				<button id="previous_page_button" class="toolbar_control_box_button toolbar_control_box_button_left">&lt;</button>
				<a id="page_number_indicator" class="toolbar_control_box_indicator"></a>
				<button id="next_page_button" class="toolbar_control_box_button toolbar_control_box_button_right">&gt;</button>
			</div>
			<div id="zoom_control_box" class="toolbar_control_box">
				<button id="zoom_out_button" class="toolbar_control_box_button toolbar_control_box_button_left">-</button>
				<a id="zoom_scale_indicator" class="toolbar_control_box_indicator"></a>
				<button id="zoom_in_button" class="toolbar_control_box_button toolbar_control_box_button_right">+</button>
			</div>
			<div id="toolbar_spacer_left" class="toolbar_spacer"></div>
			<button id="select_freehand_button" class="toolbar_button">free</button>
			<button id="select_highlight_button" class="toolbar_button">high</button>
			<button id="select_text_button" class="toolbar_button">text</button>
			<div id="toolbar_spacer_right" class="toolbar_spacer"></div>
			<button id="save_pdf_button" class="toolbar_button">save</button>
		</div>
		<div id="pdf_container">
			<canvas id="pdf_canvas"></canvas>
			<canvas id="draw_canvas"></canvas>
		</div>
		<script src="renderer.js"></script>
	</body>
</html>
