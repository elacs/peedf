<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>peedf</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<div id="toolbar">
			<div id="zoom_control_box" class="toolbar_control_box">
				<button id="zoom_out_button" class="toolbar_control_box_button toolbar_control_box_button_left">
					<img src="icons/zoom_out.png" class="toolbar_button_icon">
					<!-- <a href="https://www.flaticon.com/free-icons/zoom-out" title="zoom out icons">Zoom out icons created by Gregor Cresnar - Flaticon</a> -->
				</button>
				<a id="zoom_scale_indicator" class="toolbar_control_box_indicator"></a>
				<button id="zoom_in_button" class="toolbar_control_box_button toolbar_control_box_button_right">
					<img src="icons/zoom_in.png" class="toolbar_button_icon">
					<!-- <a href="https://www.flaticon.com/free-icons/zoom-in" title="zoom in icons">Zoom in icons created by Gregor Cresnar - Flaticon</a> -->
				</button>
			</div>
			<div id="page_control_box" class="toolbar_control_box">
				<button id="previous_page_button" class="toolbar_control_box_button toolbar_control_box_button_left">
					<img src="icons/prev.png" class="toolbar_button_icon">
					<!-- <a href="https://www.flaticon.com/free-icons/back" title="back icons">Back icons created by Roundicons - Flaticon</a> -->
				</button>
				<a id="page_number_indicator" class="toolbar_control_box_indicator"></a>
				<button id="next_page_button" class="toolbar_control_box_button toolbar_control_box_button_right">
					<img src="icons/next.png" class="toolbar_button_icon">
					<!-- <a href="https://www.flaticon.com/free-icons/next" title="next icons">Next icons created by Roundicons - Flaticon</a> -->
				</button>
			</div>
			<div id="path_control_box" class="toolbar_control_box">
				<button id="path_color_indicator_button_0" class="toolbar_control_box_button path_color_indicator_button">
					<div id="path_color_indicator_0" class="path_color_indicator"></div>
				</button>
				<button id="path_color_indicator_button_1" class="toolbar_control_box_button path_color_indicator_button">
					<div id="path_color_indicator_1" class="path_color_indicator"></div>
				</button>
				<button id="path_color_indicator_button_2" class="toolbar_control_box_button path_color_indicator_button">
					<div id="path_color_indicator_2" class="path_color_indicator"></div>
				</button>

				<a id="path_size_indicator" class="toolbar_control_box_indicator"></a>
				<button id="increase_path_size_button" class="toolbar_control_box_button">
					<img src="icons/up.png" class="toolbar_button_icon path_size_button_icon">
					<!-- <a href="https://www.flaticon.com/free-icons/next" title="next icons">Next icons created by Roundicons - Flaticon</a> -->
				</button>
				<button id="decrease_path_size_button" class="toolbar_control_box_button">
					<img src="icons/down.png" class="toolbar_button_icon path_size_button_icon">
					<!-- <a href="https://www.flaticon.com/free-icons/next" title="next icons">Next icons created by Roundicons - Flaticon</a> -->
				</button>
			</div>

			<div id="toolbar_spacer_left" class="toolbar_spacer"></div>

			<button id="select_freehand_button" class="toolbar_button">
				<img src="icons/pen.png" class="toolbar_button_icon">
				<!-- <a href="https://www.flaticon.com/free-icons/pen" title="pen icons">Pen icons created by Freepik - Flaticon</a> -->
			</button>
			<button id="select_highlight_button" class="toolbar_button">
				<img src="icons/highlighter.png" class="toolbar_button_icon">
				<!-- <a href="https://www.flaticon.com/free-icons/write" title="write icons">Write icons created by Md Tanvirul Haque - Flaticon</a> -->
			</button>
			<button id="select_text_button" class="toolbar_button">
				<img src="icons/text.png" class="toolbar_button_icon">
				<!-- <a href="https://www.flaticon.com/free-icons/text" title="text icons">Text icons created by Magnific - Flaticon</a> -->
			</button>

			<div id="toolbar_spacer_right" class="toolbar_spacer"></div>

			<button id="undo_button" class="toolbar_button undo_redo_button">
				<img src="icons/undo.png" class="toolbar_button_icon">
				<!-- <a href="https://www.flaticon.com/free-icons/undo" title="undo icons">Undo icons created by Freepik - Flaticon</a> -->
			</button>
			<button id="redo_button" class="toolbar_button undo_redo_button">
				<img src="icons/redo.png" class="toolbar_button_icon">
				<!-- <a href="https://www.flaticon.com/free-icons/redo" title="redo icons">Redo icons created by Freepik - Flaticon</a> -->
			</button>
			<button id="save_pdf_button" class="toolbar_button">
				<img src="icons/save.png" class="toolbar_button_icon">
				<!-- <a href="https://www.flaticon.com/free-icons/save" title="save icons">Save icons created by Yogi Aprelliyanto - Flaticon</a> -->
			</button>
		</div>
		<div id="pdf_container">
			<canvas id="pdf_canvas"></canvas>
			<div id="text_annotations_div"></div>
			<canvas id="draw_canvas"></canvas>
		</div>
		<script src="renderer.js"></script>
	</body>
</html>
